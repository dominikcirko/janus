spring:
  application:
    name: identity-service

  data:
    jpa:
      repositories:
        # Startup query initialization opens entity managers without a tenant, which our resolver rejects.
        # Initialize repositories on first use inside a tenant-bound request.
        bootstrap-mode: lazy

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

janus:
  security:
    protected-paths:
      - /api/*
    audience: ${JANUS_IDENTITY_AUDIENCE:identity-service}
    tenant-issuer-service-url: ${JANUS_TENANT_ISSUER_SERVICE_URL}
    tenant-issuer-service-token: ${JANUS_TENANT_ISSUER_SERVICE_TOKEN}
  jose:
    jwks-uri: ${JANUS_JWKS_URI}

app:
  debug: false
