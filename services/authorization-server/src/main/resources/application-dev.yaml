spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/janus_authorization_dev
    username: postgres
    password: postgres
janus:
  issuer: ${JANUS_ISSUER}
  signing:
    keystore:
      path: ${JANUS_SIGNING_KEYSTORE_PATH}
      password: ${JANUS_SIGNING_KEYSTORE_PASSWORD}
  jose:
    x5u_base_url: ${JANUS_X5U_BASE_URL}
app:
  debug: true
