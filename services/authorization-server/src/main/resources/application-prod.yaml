spring:
  datasource:
    url: ${JANUS_AUTHORIZATION_DATABASE_URL}
    username: ${JANUS_AUTHORIZATION_DATABASE_USERNAME}
    password: ${JANUS_AUTHORIZATION_DATABASE_PASSWORD}

janus:
  issuer: ${JANUS_ISSUER}

  signing:
    keystore:
      path: ${JANUS_SIGNING_KEYSTORE_PATH}
      password: ${JANUS_SIGNING_KEYSTORE_PASSWORD}
  jose:
    x5u_base_url: ${JANUS_X5U_BASE_URL}
