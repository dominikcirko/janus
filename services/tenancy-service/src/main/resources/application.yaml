spring:
  application:
    name: tenancy-service

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

janus:
  security:
    audience: ${JANUS_TENANCY_AUDIENCE:tenancy-service}
    tenant-issuer-service-url: ${JANUS_TENANT_ISSUER_SERVICE_URL}
    tenant-issuer-service-token: ${JANUS_TENANT_ISSUER_SERVICE_TOKEN}
  jose:
    jwks-uri: ${JANUS_JWKS_URI}

app:
  debug: false
